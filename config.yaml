# === Kebab Datastream — config.yaml ===
# Aucun chemin en dur ailleurs : tout passe par ce fichier (CLAUDE.md > Conventions).
# Les chemins de référence (images, scripts) sont relatifs à la racine du repo.
# Le disque externe reçoit tout ce qui est généré + les poids des modèles.

# --- Disque externe (hors git) ---
# NOTE AUTEUR : valeurs posées par défaut sur le disque 5 To détecté
# (/media/sky/disque 5T). À confirmer / changer si la génération tourne
# sur une autre machine que sky-master.
disque_externe_label: "disque 5T"
sorties_root: "/media/sky/disque 5T/YT-pip-gen-data/sorties"   # variantes, clips, voix générées, montages
modeles_root: "/media/sky/disque 5T/YT-pip-gen-data/modeles"   # poids des modèles

# --- ComfyUI (piloté par son API HTTP ; valeur par défaut, rien n'est installé) ---
comfyui_url: "http://127.0.0.1:8188"
comfyui_dir: "/home/sky/ComfyUI"   # cloné le 2026-10-15 (commit ba99487), modèles via ~/ComfyUI/extra_model_paths.yaml
# Lancement sur sky-master (voir journal.md, 2026-10-15) : MIOPEN_FIND_MODE=TRUST_VERIFY_FULL, --disable-dynamic-vram,
# --disable-pinned-memory, et dans son propre groupe mémoire : systemd-run --user --scope -p MemoryMax=7G

# --- Machine de production ---
# À trancher (CLAUDE.md > À trancher). Relevé du 2026-10-13 : aucune carte NVIDIA sur le parc.
#   sky-master : AMD Radeon RX 5700 XT (gfx1010), 8 Go de VRAM, ROCm 6.2.2 ; 15 Go de RAM ; sudo sans mot de passe
#     (relevé le 2026-10-15 : /etc/sudoers.d/linux-upgrade, contrairement à ce que disait le relevé du 2026-10-13)
#   pc1 : GeForce GTX 770 (2013), sans pilote NVIDIA
#   pc2 : portable, Mobility Radeon HD 5650, 7 Go de RAM
#   pc3 : portable, Intel HD Graphics 620, 7 Go de RAM
machine_production: null       # ex : "sky-master"
vram_go: 8                     # sky-master ; carte AMD, relevé avec rocminfo (pas de nvidia-smi)

# --- Outils (chemins, remplis au fur et à mesure, rien installé pour l'instant) ---
ffmpeg_bin: "ffmpeg"           # ffmpeg 5.1.9, déjà sur sky-master
kdenlive_appimage: null        # à poser : le Kdenlive installé (22.12.3, paquet Debian) n'a pas l'import OpenTimelineIO natif (25.04 et plus)
python_venv: "/home/sky/venvs/kebab"   # Python 3.13, PyTorch 2.12.0+rocm7.14.1 pour gfx1010 (AMD, index whl-multi-arch), posé le 2026-10-15
