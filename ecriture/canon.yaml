# === Kebab Datastream — canon.yaml ===
# LA seule vérité : noms, lieux, âges. Une source de vérité par sujet.
# Ne jamais modifier les noms présents dans les scripts de l'auteur (CLAUDE.md règle 6).
# Chaque info vient de la bible (ecriture/bible/bible.md), avec sa ligne source.
# Couvre le casting récurrent ; les noms ponctuels vivent dans les textes d'épisode.

# ---------------------------------------------------------------------------
# À TRANCHER AVEC L'AUTEUR (ne pas décider seul — CLAUDE.md)
# ---------------------------------------------------------------------------
a_trancher:
  canon_kebab:
    # Décide un LoRA ET tous les décors.
    # La bible porte les deux : section « ## MEHMET » (l.247), mais « Le kebab (Mohamed) » (l.162).
    # Le passé suit le nom : la bible dit Mohamed resté ouvert à Alger pendant le Hirak (2019) ;
    # la bible d'écriture (bible-ecriture.md) dit Mehmet, « Istanbul 2016, les tanks », avec un cousin à Istanbul.
    options:
      - "Mohamed à Annemasse (texte du CERN)"
      - "Mehmet à Clichy (texte Navier-Stokes)"
    choix: null
  episode_1_couvre:
    options:
      - "« Le Miroir » seul"
      - "« Le Miroir » + le call (briefing de guerre)"
    choix: null
  points_narratifs_en_suspens:
    theorie_du_tout: null      # ambiguë ou révélée
    quenelles: null
    vanne_sodomie: null
    briefing_de_guerre: null   # cet épisode ou le suivant
  style_reference_serie:
    question: "Le rendu de l'image maître de Maëlle devient-il la référence de style de toute la série ?"
    choix: null

